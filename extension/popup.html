<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Trinidorewards Hunt Tracker</title>
    <style>
      body {
        margin: 0;
        width: 260px;
        background: #0d0e16;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .wrap {
        padding: 16px;
      }
      h1 {
        font-size: 14px;
        font-weight: 700;
        margin: 0 0 4px;
      }
      p.sub {
        font-size: 11px;
        color: #8c8ca0;
        margin: 0 0 14px;
      }
      .status {
        font-size: 13px;
        font-weight: 600;
        padding: 10px 12px;
        border-radius: 8px;
        background: #151723;
        border: 1px solid #2c2f42;
        margin-bottom: 12px;
      }
      .status.active {
        color: #4ade80;
        border-color: rgba(74, 222, 128, 0.3);
      }
      .status.inactive {
        color: #facc15;
        border-color: rgba(250, 204, 21, 0.3);
      }
      .status.error {
        color: #f87171;
        border-color: rgba(248, 113, 113, 0.3);
      }
      button {
        width: 100%;
        padding: 9px;
        border-radius: 6px;
        border: none;
        background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
        color: #fff;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Trinidorewards Hunt Tracker</h1>
      <p class="sub">Open Stake to add bonuses to the active hunt.</p>
      <div id="status" class="status">Checking&hellip;</div>
      <button id="refresh" type="button">Refresh status</button>
    </div>
    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
